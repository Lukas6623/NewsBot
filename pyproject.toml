[project]
name = "serverguard"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["aiogram>=3.13,<4", "aiosqlite>=0.20,<1", "fastapi>=0.115,<1", "httpx>=0.27,<1", "pydantic-settings>=2.5,<3", "uvicorn[standard]>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["serverguard", "serverguard.database", "serverguard.services", "api", "bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
